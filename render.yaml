# Render Blueprint for the OpenManus Platform.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo -> Apply.
# Render builds runtime/Dockerfile and prompts you for the `sync: false` values.
# Full walkthrough and troubleshooting: ./DEPLOY.md
# Spec reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: openmanus-platform
    runtime: docker
    # Closest Render region to West Africa. Alternatives: oregon, ohio, virginia, singapore.
    region: frankfurt
    # 1 CPU / 2 GB RAM ($25/mo). The agent runs npm installs, builds, test suites
    # and headless Chromium inside this container; 512 MB (0.5c-512mb, $7/mo) gets
    # OOM-killed mid-task on real projects. Heavier projects: 2c-4g ($85/mo).
    plan: 1c-2g
    dockerfilePath: ./runtime/Dockerfile
    dockerContext: ./runtime
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # Give in-flight agent tasks a moment to checkpoint on redeploys.
    maxShutdownDelaySeconds: 60
    # SQLite database + per-project workspaces (incl. node_modules / .venv). Without
    # this, all projects and task history are wiped on every deploy/restart.
    # $0.25/GB/month. Size can grow later, never shrink.
    disk:
      name: openmanus-workspace
      mountPath: /app/OpenManus/workspace
      sizeGB: 10
    envVars:
      # ---- LLM (required for agent execution; see DEPLOY.md for provider values) ----
      - key: LLM_MODEL
        sync: false # e.g. claude-sonnet-4-5  |  gpt-4.1
      - key: LLM_BASE_URL
        sync: false # e.g. https://api.anthropic.com/v1/  |  https://api.openai.com/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MAX_TOKENS
        value: "8192"
      - key: LLM_TEMPERATURE
        value: "0.0"
      # Only for Azure / Bedrock / Ollama-style endpoints; leave unset for Anthropic/OpenAI.
      # - key: LLM_API_TYPE
      #   value: azure
      # - key: LLM_API_VERSION
      #   value: 2024-08-01-preview

      # Set to true/false if your model's vision support is misdetected (screenshots).
      # - key: LLM_SUPPORTS_IMAGES
      #   value: "true"

      # ---- Agent behaviour ----
      - key: AGENT_MAX_STEPS            # tool-using steps per implementation/repair pass
        value: "40"
      - key: AGENT_MAX_REPAIR_CYCLES    # validation-driven repair passes after implementation
        value: "3"
      - key: AGENT_COMMAND_TIMEOUT      # seconds before a single shell command is interrupted
        value: "300"
      - key: HUMAN_REPLY_TIMEOUT        # seconds the agent waits for your answer to a question
        value: "900"

      # ---- GitHub integration (list/clone repos, push, pull requests, publish). ----
      # See DEPLOY.md step 3. Options:
      #   A) classic token (scope `repo`)             -> GITHUB_TOKEN only
      #   B) fine-grained token                       -> GITHUB_TOKEN only
      #      Contents + Pull requests (read/write), Metadata (read), and
      #      Administration (read/write) only if the agent should create repos.
      #   C) both: fine-grained as GITHUB_TOKEN (always tried first) and classic as
      #      GITHUB_CLASSIC_TOKEN, used only when GitHub refuses the first token
      #      (API 401/403/404, git authentication errors).
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_CLASSIC_TOKEN
        sync: false # optional (option C); leave empty otherwise
      - key: GIT_AUTHOR_NAME
        value: OpenManus Platform
      - key: GIT_AUTHOR_EMAIL
        value: openmanus@users.noreply.github.com
      - key: GIT_COMMITTER_NAME
        value: OpenManus Platform
      - key: GIT_COMMITTER_EMAIL
        value: openmanus@users.noreply.github.com

      # ---- Access control. The service URL is public; this gates the UI and API. ----
      # Render generates a random password. Read it from the service's Environment tab.
      - key: PLATFORM_USERNAME
        value: admin
      - key: PLATFORM_PASSWORD
        generateValue: true
