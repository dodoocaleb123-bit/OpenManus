# Render Blueprint for the OpenManus Platform.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo -> Apply.
# Render builds runtime/Dockerfile and prompts you for the `sync: false` values.
# Full walkthrough and troubleshooting: ./DEPLOY.md
# Spec reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: openmanus-platform
    runtime: docker
    # Closest Render region to West Africa. Alternatives: oregon, ohio, virginia, singapore.
    region: frankfurt
    # Smallest plan that supports a persistent disk (0.5 CPU / 512 MB, ~$7/mo).
    # If you use the shared browser (headless Chromium) heavily, use 1c-2g instead.
    plan: 0.5c-512mb
    dockerfilePath: ./runtime/Dockerfile
    dockerContext: ./runtime
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # Give in-flight agent tasks a moment to checkpoint on redeploys.
    maxShutdownDelaySeconds: 60
    # SQLite database + per-project git checkouts. Without this, all projects and
    # task history are wiped on every deploy/restart. Size can grow later, not shrink.
    disk:
      name: openmanus-workspace
      mountPath: /app/OpenManus/workspace
      sizeGB: 5
    envVars:
      # ---- LLM (required for agent execution; see DEPLOY.md for provider values) ----
      - key: LLM_MODEL
        sync: false # e.g. claude-sonnet-4-5  |  gpt-4.1
      - key: LLM_BASE_URL
        sync: false # e.g. https://api.anthropic.com/v1/  |  https://api.openai.com/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MAX_TOKENS
        value: "8192"
      - key: LLM_TEMPERATURE
        value: "0.0"
      # Only for Azure / Bedrock / Ollama-style endpoints; leave unset for Anthropic/OpenAI.
      # - key: LLM_API_TYPE
      #   value: azure
      # - key: LLM_API_VERSION
      #   value: 2024-08-01-preview

      # ---- GitHub integration (repo discovery, clone, push). Needs `repo` scope. ----
      - key: GITHUB_TOKEN
        sync: false
      - key: GIT_AUTHOR_NAME
        value: OpenManus Platform
      - key: GIT_AUTHOR_EMAIL
        value: openmanus@users.noreply.github.com
      - key: GIT_COMMITTER_NAME
        value: OpenManus Platform
      - key: GIT_COMMITTER_EMAIL
        value: openmanus@users.noreply.github.com

      # ---- Access control. The service URL is public; this gates the UI and API. ----
      # Render generates a random password. Read it from the service's Environment tab.
      - key: PLATFORM_USERNAME
        value: admin
      - key: PLATFORM_PASSWORD
        generateValue: true
