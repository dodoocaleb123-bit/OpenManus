<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OpenManus Platform</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;background:#090b0e;color:#e9edf1}.shell{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:800;font-size:21px}.badge{border:1px solid #26303a;border-radius:999px;padding:7px 11px;color:#9ee6b0;font-size:12px}.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}.card{background:#101419;border:1px solid #20262e;border-radius:16px;padding:18px}input,textarea,button,select{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #2a323b;background:#0b0f13;color:#fff;padding:10px}textarea{min-height:130px;resize:vertical}button{margin-top:9px;cursor:pointer;background:#f0f3f6;color:#0b0d10;font-weight:750}.secondary{background:#171c22;color:#e9edf1}.project{padding:11px;border-radius:10px;background:#171c22;margin-top:8px;cursor:pointer}.project.active{outline:1px solid #73808d}.muted{color:#8995a1;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.repo{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px;border:1px solid #222a33;border-radius:10px;margin-top:7px}.repo button{width:auto;margin:0;padding:7px 10px}.panel{margin-top:14px;padding-top:14px;border-top:1px solid #20262e}pre{white-space:pre-wrap;word-break:break-word;max-height:430px;overflow:auto;color:#b9c3ce}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.shell{padding:16px}}
</style></head>
<body><div class="shell"><div class="top"><div class="brand">OpenManus Platform</div><div class="badge">Agent runtime online</div></div>
<div class="grid"><aside class="card"><h3>Projects</h3><input id="projectName" placeholder="Project name"/><button onclick="createProject()">Create project</button><div id="projects" class="muted" style="margin-top:16px">Loading…</div>
<div class="panel"><h3>GitHub</h3><div id="githubUser" class="muted">Checking connection…</div><button class="secondary" onclick="loadRepos()">Load repositories</button><div id="repos"></div></div></aside>
<main class="card"><div id="selected" class="muted">Create or select a project.</div><div id="gitInfo" class="muted" style="margin-top:8px"></div><textarea id="prompt" placeholder="Tell the agent what to build or change…"></textarea><button id="run" onclick="runTask()" disabled>Run agent</button>
<div class="row"><button class="secondary" onclick="gitStatus()">Git status</button><button class="secondary" onclick="gitDiff()">View diff</button></div><div class="row"><input id="branch" placeholder="new branch name"/><button class="secondary" onclick="createBranch()">Create branch</button></div><div class="row"><input id="commit" placeholder="commit message"/><button class="secondary" onclick="commitChanges()">Commit</button></div><button class="secondary" onclick="pushChanges()">Push current branch</button>
<h3>Browser</h3><div class="row"><input id="browserUrl" placeholder="https://example.com"/><button class="secondary" onclick="startBrowser()">Start browser</button></div><div id="browserInfo" class="muted">No browser session.</div><img id="browserShot" style="display:none;width:100%;margin-top:10px;border:1px solid #20262e;border-radius:10px" alt="Browser screenshot"/><div class="row"><input id="browserSelector" placeholder="CSS selector (e.g. input[name=q])"/><button class="secondary" onclick="browserClick()">Click</button></div><div class="row"><input id="browserText" placeholder="Text to type"/><button class="secondary" onclick="browserType()">Type</button></div><div class="row"><input id="browserNav" placeholder="Navigate to URL"/><button class="secondary" onclick="browserNavigate()">Navigate</button></div><button class="secondary" onclick="refreshBrowser()">Refresh screenshot</button><button class="secondary" onclick="stopBrowser()">Stop browser</button><h3>Task history</h3><div id="history" class="muted">No tasks yet.</div><h3>Task activity</h3><pre id="events">No task running.</pre></main></div></div>
<script>
let projects=[],selected=null,browserSession=null,browserTimer=null;
async function api(url,opts={}){const r=await fetch(url,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function loadProjects(){projects=await api('/api/projects');renderProjects();try{const u=await api('/api/github/user');document.getElementById('githubUser').textContent=`GitHub: ${u.login}`;}catch(e){document.getElementById('githubUser').textContent='GitHub: GITHUB_TOKEN not connected';}}
function renderProjects(){const el=document.getElementById('projects');el.innerHTML='';projects.forEach(p=>{const d=document.createElement('div');d.className='project'+(selected?.id===p.id?' active':'');d.textContent=p.name;d.onclick=()=>selectProject(p);el.appendChild(d)});if(!projects.length)el.textContent='No projects yet.'}
async function refreshHistory(){if(!selected)return;try{const ts=await api(`/api/projects/${selected.id}/tasks`);const el=document.getElementById('history');el.innerHTML=ts.slice().reverse().map(t=>`<div class="repo"><span>${t.status} · attempt ${t.attempt}<br><small>${escapeHtml(t.prompt.slice(0,90))}</small></span>${t.status!=='running'?`<button onclick="resumeTask('${t.id}')">Resume</button>`:''}</div>`).join('')||'No tasks yet.'}catch(e){document.getElementById('history').textContent=e.message}}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selectProject(p){selected=p;document.getElementById('selected').textContent=`Project: ${p.name}`;document.getElementById('run').disabled=false;document.getElementById('gitInfo').textContent=p.git_ready?`Repository: ${p.repository} · branch: ${p.branch||'unknown'}`:'No GitHub repository connected';renderProjects();refreshHistory()}
async function createProject(){const name=document.getElementById('projectName').value.trim();if(!name)return;try{const p=await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});projects.push(p);selectProject(p);document.getElementById('projectName').value='';}catch(e){alert(e.message)}}
async function loadRepos(){const el=document.getElementById('repos');try{const rs=await api('/api/github/repos');el.innerHTML=rs.map(r=>`<div class="repo"><span>${r.full_name}</span><button onclick="connectRepo('${r.owner.login}','${r.name}')">Connect</button></div>`).join('')||'<div class="muted">No repositories.</div>'}catch(e){el.textContent=e.message}}
async function connectRepo(owner,repo){if(!selected)return alert('Select a project first');try{const p=await api(`/api/projects/${selected.id}/github/connect`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({owner,repo})});selected=p.project;projects=projects.map(x=>x.id===selected.id?selected:x);selectProject(selected);alert('Repository cloned into the project workspace.')}catch(e){alert(e.message)}}
async function gitStatus(){if(!selected)return;try{const d=await api(`/api/projects/${selected.id}/git/status`);document.getElementById('events').textContent=JSON.stringify(d,null,2)}catch(e){alert(e.message)}}
async function gitDiff(){if(!selected)return;try{const d=await api(`/api/projects/${selected.id}/git/diff`);document.getElementById('events').textContent=d.diff||'No changes.'}catch(e){alert(e.message)}}
async function createBranch(){if(!selected)return;const name=document.getElementById('branch').value.trim();if(!name)return;try{const d=await api(`/api/projects/${selected.id}/git/branch`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});selected.branch=d.branch;selectProject(selected)}catch(e){alert(e.message)}}
async function commitChanges(){if(!selected)return;const message=document.getElementById('commit').value.trim();if(!message)return;try{await api(`/api/projects/${selected.id}/git/commit`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});document.getElementById('commit').value='';await gitStatus()}catch(e){alert(e.message)}}
async function pushChanges(){if(!selected)return;try{const d=await api(`/api/projects/${selected.id}/git/push`,{method:'POST'});document.getElementById('events').textContent=d.result||'Pushed.'}catch(e){alert(e.message)}}
async function resumeTask(id){try{const task=await api(`/api/tasks/${id}/resume`,{method:'POST'});document.getElementById('events').textContent='Resuming…';const es=new EventSource(`/api/tasks/${task.id}/events`);es.onmessage=e=>{const ev=JSON.parse(e.data);document.getElementById('events').textContent+=`\n[${ev.type}] ${ev.message}`;if(ev.type==='task.succeeded'||ev.type==='task.failed'){es.close();refreshHistory();document.getElementById('run').disabled=false}};es.onerror=()=>{es.close();refreshHistory()}}catch(e){alert(e.message)}}
async function runTask(){if(!selected)return;const prompt=document.getElementById('prompt').value.trim();if(!prompt)return;document.getElementById('run').disabled=true;document.getElementById('events').textContent='Starting…';try{const task=await api('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id:selected.id,prompt,browser_session_id:browserSession?.id||null})});const es=new EventSource(`/api/tasks/${task.id}/events`);es.onmessage=e=>{const ev=JSON.parse(e.data);document.getElementById('events').textContent+=`\n[${ev.type}] ${ev.message}`;if(ev.type==='task.succeeded'||ev.type==='task.failed'){es.close();refreshHistory();document.getElementById('run').disabled=false;}};es.onerror=()=>{es.close();document.getElementById('run').disabled=false}}catch(e){document.getElementById('events').textContent=e.message;document.getElementById('run').disabled=false}}
async function startBrowser(){if(!selected)return alert('Select a project first');const url=document.getElementById('browserUrl').value.trim()||'about:blank';try{browserSession=await api('/api/browser/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id:selected.id,url,headless:true})});updateBrowser();startBrowserRefresh();}catch(e){alert(e.message)}}
function startBrowserRefresh(){if(browserTimer)clearInterval(browserTimer);browserTimer=setInterval(refreshBrowser,2500)}
async function refreshBrowser(){if(!browserSession)return;try{browserSession=await api(`/api/browser/sessions/${browserSession.id}`);updateBrowser();if(browserSession.running){document.getElementById('browserShot').src=`/api/browser/sessions/${browserSession.id}/screenshot?t=${Date.now()}`;document.getElementById('browserShot').style.display='block'}}catch(e){document.getElementById('browserInfo').textContent=e.message}}
function updateBrowser(){document.getElementById('browserInfo').textContent=browserSession?`Browser ${browserSession.running?'running':'stopped'} · ${browserSession.url||'about:blank'} · ${browserSession.id}`:'No browser session.'}
async function browserNavigate(){if(!browserSession)return;const url=document.getElementById('browserNav').value.trim();if(!url)return;try{browserSession=await api(`/api/browser/sessions/${browserSession.id}/navigate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});await refreshBrowser()}catch(e){alert(e.message)}}
async function browserClick(){if(!browserSession)return;const selector=document.getElementById('browserSelector').value.trim();if(!selector)return;try{browserSession=await api(`/api/browser/sessions/${browserSession.id}/click`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({selector})});await refreshBrowser()}catch(e){alert(e.message)}}
async function browserType(){if(!browserSession)return;const selector=document.getElementById('browserSelector').value.trim(),text=document.getElementById('browserText').value;if(!selector)return;try{browserSession=await api(`/api/browser/sessions/${browserSession.id}/type`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({selector,text,submit:false})});await refreshBrowser()}catch(e){alert(e.message)}}
async function stopBrowser(){if(!browserSession)return;try{await api(`/api/browser/sessions/${browserSession.id}`,{method:'DELETE'});browserSession=null;clearInterval(browserTimer);document.getElementById('browserShot').style.display='none';updateBrowser()}catch(e){alert(e.message)}}
loadProjects();
</script></body></html>
